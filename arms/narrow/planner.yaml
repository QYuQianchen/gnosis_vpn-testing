# A COMBINATION, deliberately -- unlike the other arms this is not a one-variable
# change. It asks a product question rather than a mechanistic one: is there a
# shippable setting that keeps some relay diversity and most of pin's benefit?
# Three candidates instead of fifty, weights untempered so the best dominates,
# no blind exploration. Read it against pin and no-explore, not against auto
# alone.
max_cached_paths: 3
return_path_weight_temper: 1.0
return_path_exploration: 0.0
