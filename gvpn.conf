# gvpn.conf -- one place for every knob the kit reads.
#
# Sourced by the setup scripts and exported into the environment, so the bench
# script picks these up as its defaults too (it already reads GVPN_* variables).
# Command-line flags always win over this file.
#
# Edit locally, push, pull on the VM (see docs/dev-workflow.md) -- that way the
# configuration of a run is version-controlled alongside the scripts, which
# matters when you have to say six weeks later exactly what was measured.

# ---------------------------------------------------------------- the build --

# stable    | jura-prod, jura-dev   -- what production users actually run
# snapshot  | jura-prod, jura-dev   -- nightly of the standard line
# experimental | piz-palu-dev       -- nightly of the experimental line
#
# A channel switch can move the client across release lines, so the networks
# available change with it. Re-running the installer WITHOUT --channel selects
# stable, which silently downgrades a snapshot install -- 05-set-version.sh
# always passes the channel explicitly for exactly that reason.
GVPN_CHANNEL=snapshot

GVPN_NETWORK=jura-prod

# Exact apt version to hold at, e.g. 0.96.0. Empty means "newest in the channel".
#
# PIN THIS ONCE A STUDY IS UNDER WAY. Every arm has to run on the same binary or
# the comparison is between versions rather than between routing modes, and a
# mid-run upgrade splits the dataset in a way interleaving cannot repair.
# `05-set-version.sh --list` shows what is available.
GVPN_PIN_VERSION=2026.09.24+build.012613

# ------------------------------------------------------------ service flags --

# 0-hop arms need --allow-insecure; 2+ hop arms need --allow-experimental.
# Both are CLI-only on the binary, so they go in via a systemd drop-in.
GVPN_ALLOW_INSECURE=1
GVPN_ALLOW_EXPERIMENTAL=0

# --------------------------------------------------------------- the run ----

# ONE exit, held constant -- the cheapest, cleanest comparison.
GVPN_DESTINATION=UK

# Or sweep several, making the exit a DIMENSION rather than a constant: every arm
# runs against every exit each cycle, so pinned-vs-auto can be read per exit.
# This multiplies the schedule by the number of exits -- check with --dry-run.
# Exits differ enormously in RTT (Europe ~90 ms vs India ~280 ms from an EU VM),
# and the reassembly-window hypothesis predicts the pinning benefit GROWS with
# RTT, so a sweep is how you test that rather than assume it.
# GVPN_DESTINATIONS="UK USA India"

# url = curl a fixed volume from a public endpoint, no second machine needed.
# iperf3 = a server you control (adds upload, UDP, and sender-CC control).
GVPN_TARGET=url
GVPN_DL_URL='https://speed.cloudflare.com/__down?bytes={bytes}'
# Upload endpoint, so url mode measures both directions without a second machine.
# Empty = skip the upload leg.
GVPN_UL_URL='https://speed.cloudflare.com/__up'

# Only used with GVPN_TARGET=iperf3, or for the UDP leg via --udp-host.
GVPN_IPERF_SERVER=
GVPN_UDP_HOST=

# Ping target for the in-tunnel loss/jitter measurement.
GVPN_PING_TARGET=1.1.1.1

# ------------------------------------------------------------- housekeeping --

# Planner DEBUG logging produces ~100 MB/hour; the packaged daily rotation loses
# the lines the experiment is about.
GVPN_LOG_SIZE=200M
GVPN_LOG_KEEP=20
