# studies/2026-09-22-pin-vs-auto.conf
#
# The first real study: does pinning the path raise the performance floor?
#
# Sourced ON TOP of gvpn.conf, so it states only what differs. Run it with:
#
#     make launch STUDY=2026-09-22-pin-vs-auto
#
# WHY A STUDY FILE RATHER THAN FLAGS
#
#   A result is only worth anything if someone can say, six weeks later, exactly
#   what produced it. Flags live in one person's shell history. This file is
#   tracked, its name goes in the report directory, and the run's manifest
#   records the kit revision it was read at -- so "what settings produced this
#   table?" is answered by `git show`, not by memory.
#
#   Copy this file for the next study. Do not edit it after its run has started:
#   an edited study file is a study whose arms were not all measured the same way.

# ------------------------------------------------------------------ binary --

# PINNED for the duration. Every arm must run on the same build or the comparison
# is between versions rather than between routing modes, and a mid-run upgrade
# splits the dataset in a way interleaving cannot repair.
GVPN_CHANNEL=snapshot
GVPN_NETWORK=jura-prod
GVPN_PIN_VERSION=2026.09.24+build.012613

# --------------------------------------------------------------------- run --

GVPN_PROFILE=soak

# Arms inner, exits outer: every arm meets every exit in the same cycle, so the
# pinned-vs-auto comparison holds per exit and network-wide load cancels.
GVPN_ARMS="auto pin-planner no-explore"

# Three exits spanning a wide RTT range. The reassembly-window hypothesis predicts
# the pinning benefit GROWS with RTT; a sweep is how that gets tested rather than
# assumed. Costs 3x the wall clock -- check with --dry-run before committing.
GVPN_DESTINATIONS="UK USA India"

# 25 MB matches what the team already uses for manual checks, so numbers from this
# study and from someone's ad-hoc test are comparable.
GVPN_MODE=bytes
GVPN_DL_BYTES=26214400
GVPN_UL_BYTES=26214400

# Five transfers per held-open session, five minutes apart: enough to tell a
# session that is dealt its throughput from one that re-draws it each transfer,
# and long enough between them that the gap is a real idle period.
GVPN_REPS=5
GVPN_REP_GAP=300

GVPN_TARGET=url
GVPN_PING_TARGET=1.1.1.1

# ------------------------------------------------------------------ report --

# FREEZE THIS BEFORE THE RUN, from the quick run's `auto` p25. Choosing the floor
# threshold after seeing the pinned arm makes the headline number whatever you
# want it to be.
GVPN_FLOOR_MBPS=5
