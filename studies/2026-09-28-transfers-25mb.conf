# 2026-09-24-transfers-25mb, re-run on build 2026.09.28+build.013542.
#
# 25 MB transfers, repeated. The shape closest to the team's existing test and
# to what a user actually feels: fixed volume, measure how long it took.
#
# ~3 h for two arms against one exit. The wall clock is driven by arms x exits x
# cycles, NOT by the transfer size -- a 25 MB leg is ~40 s, but a session costs
# ~3 min because connecting, settling and cooling down cost more than the
# transfer does. See docs/studies.md, "Why it takes as long as it does".

GVPN_PROFILE=transfers          # 30 cycles, bytes mode, 25M each way, 1 rep

GVPN_ARMS="auto pin-planner"    # the question, and nothing else. Each extra arm
                                # is +1.6 h; each extra exit multiplies.
GVPN_DESTINATIONS="UK"          # one exit. Add more only once there is a signal.

GVPN_DL_BYTES=25M
GVPN_UL_BYTES=25M
GVPN_REPS=1                     # one transfer per session: sessions are the unit
                                # the floor rate is computed over, so more
                                # sessions beats more transfers per session.

GVPN_CHANNEL=snapshot
GVPN_NETWORK=jura-prod

# Frozen for the whole study: a mid-study upgrade turns the comparison into one
# between versions. Must match what is installed; preflight checks.
GVPN_PIN_VERSION=2026.09.28+build.013542

# Leave empty: preflight measures auto's p25 and writes it here, BEFORE any arm
# is compared, so the pinned arm cannot influence the bar it is judged against.
GVPN_FLOOR_MBPS=
